name: "Formatting"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  black:
    # NOTE: the job/matrix is still named "black"/"isort" only because those are required
    # status check names in branch protection; both now actually run ruff underneath.
    # Renaming them requires updating the required-check list in branch protection too.
    name: "black (${{ matrix.tool }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: ["black", "isort"]
        include:
          - tool: black
            command: "ruff format --check ."
          - tool: isort
            command: "ruff check --select I ."
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --group linting
      - name: ${{ matrix.tool }} Code Formatter
        run: |
          uv run ${{ matrix.command }}
