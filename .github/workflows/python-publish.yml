# This GitHub workflow is only needed for python package releases which are supposed to be published on pypi.
# It requires the Github "environments" feature (see instructions below) it might not be available for private free accounts (but works for public or organization repos).
# After creating the "release" environment in the Github repo settings, you need to enter your Github organization/user name + repo name + "python-publish.yml" workflow file name in the PyPI UI to make this work.

# This workflow uploads a Python Package using uv when a release is created.
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Upload Python Package

on:
  release:
    types: [ created, edited ]

jobs:
  tests:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - name: Run Unit Tests
        run: |
          uv sync --group tests
          uv run pytest
      - name: Run Linting
        run: |
          uv sync --group linting
          uv run ruff check src/efoli unittests
      - name: Run Type Check
        run: |
          uv sync --group type_check
          uv run mypy --show-error-codes src/efoli --strict
          uv run mypy --show-error-codes unittests --strict
      - name: Run Spell Check
        run: |
          uv sync --group spell_check
          uv run codespell --ignore-words=domain-specific-terms.txt src
          uv run codespell --ignore-words=domain-specific-terms.txt README.md
      - name: Run Coverage
        run: uv sync --group coverage
      - name: Record Coverage
        working-directory: unittests
        run: |
          uv run coverage run -m pytest
          uv run coverage report --fail-under 95 --omit .venv/*,unittests/*

  build-n-publish:
    name: Build and publish Python 🐍 distributions 📦 to PyPI and TestPyPI
    runs-on: ubuntu-latest
    # Specifying a GitHub environment, # Specifying a GitHub environment, which is strongly recommended by PyPI: https://docs.pypi.org/trusted-publishers/adding-a-publisher/
    # you have to create an environment in your repository settings and add the environment name here
    environment: release
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    needs: tests
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - name: Build wheel and source distributions
        run: uv build
      - name: Publish distribution 📦 to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        run: uv publish --trusted-publishing=automatic
