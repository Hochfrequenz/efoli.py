name: "Linting"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  pylint:
    name: "Python Code Quality and Lint (${{ matrix.linter-env }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        linter-env: ["linting", "type_check", "spell_check"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --group ${{ matrix.linter-env }}
      - name: Run Linting
        if: matrix.linter-env == 'linting'
        run: |
          uv run ruff check src/efoli unittests
      - name: Run Type Check
        if: matrix.linter-env == 'type_check'
        run: |
          uv run mypy --show-error-codes src/efoli --strict
          uv run mypy --show-error-codes unittests --strict
      - name: Run Spell Check
        if: matrix.linter-env == 'spell_check'
        run: |
          uv run codespell --ignore-words=domain-specific-terms.txt src
          uv run codespell --ignore-words=domain-specific-terms.txt README.md
