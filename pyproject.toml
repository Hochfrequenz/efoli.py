[project]
name = "efoli"
description = "Enums and related helper functions that model EDIFACT relevant data for German utilities"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Hochfrequenz Unternehmensberatung GmbH", email = "info+github@hochfrequenz.de" }]
keywords = ["edifact", "enums", "bdew"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["pytz"]     # add all the dependencies here
dynamic = ["readme", "version"]

[project.urls]
Changelog = "https://github.com/Hochfrequenz/efoli.py/releases"
Homepage = "https://github.com/Hochfrequenz/efoli.py"

[dependency-groups]
coverage = [
    "coverage==7.15.2; python_version >= '3.10'",
    {include-group = "tests"}
]
formatting = [
    "black==26.5.1; python_version >= '3.10'",
    "isort==8.0.1; python_version >= '3.10'"
]
linting = [
    "pylint==4.0.6; python_version >= '3.10'",
    {include-group = "tests"}
]
spell_check = [
    "codespell==2.4.3"
]
tests = [
    "pytest==8.4.2"
]
type_check = [
    "mypy==2.3.0; python_version >= '3.10'",
    "types-pytz==2026.3.1.20260727; python_version >= '3.10'",
    {include-group = "tests"}
]
dev = [
    {include-group = "tests"},
    {include-group = "linting"},
    {include-group = "type_check"},
    {include-group = "coverage"},
    {include-group = "spell_check"},
    {include-group = "formatting"},
    "pre-commit"
]

[tool.uv]
default-groups = []

[tool.black]
line-length = 120
target_version = ["py311", "py312"]

[tool.isort]
line_length = 120
profile = "black"

[tool.pylint."MESSAGES CONTROL"]
max-line-length = 120

[mypy]
truethy-bool = true

[tool.mypy]
disable_error_code = []

[build-system]
requires = ["hatchling>=1.8.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_efoli_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
